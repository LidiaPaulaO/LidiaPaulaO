name: 🐍 Generate Snake Game

on:
  schedule:
    # Executa automaticamente todo dia à meia-noite (UTC)
    - cron: "0 0 * * *"
  workflow_dispatch: # Permite rodar manualmente
  push:
    branches:
      - main

jobs:
  build:
    name: 🎮 Gerar animação da cobrinha
    runs-on: ubuntu-latest

    steps:
      # Etapa 1: Faz checkout do repositório
      - name: 📂 Checkout do repositório
        uses: actions/checkout@v4

      # Etapa 2: Gera os arquivos SVG da cobrinha (tema claro e escuro)
      - name: 🐍 Geração da cobrinha
        uses: Platane/snk@v3
        with:
          github_user_name: LidiaPaulaO
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      # Etapa 3: Publica os SVGs no branch "output"
      - name: 🚀 Publicar resultado no branch "output"
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
